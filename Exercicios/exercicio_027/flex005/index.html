<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Alinhado Itens</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    body, html {
        width: 100%;
        height: 100%;
    }
    
    body{
        background-color: rgba(128, 128, 128, 0.684);
    }


    main{
        width: 50vw;
        height: 80vh;
        background-color: white;


        display: flex;
        justify-content: center;
        align-items: center;
        flex-flow: row nowrap;
    }
    section{
        background-color: lightcoral;
        width: 200px;
        height: 200px;
    }

</style>
<body>
    <main>
        <section>
            <h1>Ola,Mundo!</h1>
        </section>




    </main>

    
</body>
</html>
