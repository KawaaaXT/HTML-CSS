<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Basis</title>
</head>
<style>
    *{
         margin: 0px;
         padding: 0px;
         box-sizing: border-box;
    }
    body, html {
        width: 100%;
        height: 100%;
    }
    body{
        background-color: antiquewhite;
    }
    main{
        width: 80vw;
        height: 80vh;
        background-color: white;

    }
    div#container{
        display: flex;
        flex-flow: row nowrap;
        height: 300px;
        background-color: rgba(0, 255, 255, 0.336);

        justify-content: flex-start;
        align-items: flex-start;
    }
    section.item1{
        order: -1;
        background-color: aquamarine;
        padding: 10px;
        align-self: center;
        letter-spacing: 3px;
        flex-basis: 500px;
    }
    section.item2{
        order: -2;
        background-color: beige;
        padding: 10px;
        align-self: flex-end;
    }
    section.item3{
        order: -4;
        background-color: cadetblue;
        padding: 10px;

        align-self: stretch;
    }




</style>
<body>
    <main>
        <div id="container">
            <section class="item1">

            </section>
            <section class="item2">
                OLA ME CHAMO ANA
            </section>
            <section class="item3">
                OLA ME CHAMO PAULO

            </section>

        </div>
    </main>
    
</body>
</html>
