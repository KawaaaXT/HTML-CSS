<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Grow e Flex-Shrink</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    body,html {
        width: 100%;
        height: 100%;
    }
    body{
        background-color: aqua;
    }
    main{
        background-color: white;
        box-shadow: 0px 0px 9px black;
    }
    div#container{
        display: flex;
        width: 100vw;
        height: 100vh;
        background-color: gray;


        justify-content: flex-start;
        align-items: flex-start;
        flex-flow: row nowrap;
    }
    section.filho{
        order: -1;
        background-color: rgb(255, 127, 127);
        padding: 20px;
        color: white;

        flex-basis: 150px;
        flex-shrink: 1 ;
        flex-grow: 2;
        
    }
    section.filho2{
        order: 9;
        background-color: rgb(214, 214, 5);
        padding: 20px;
        color: rgb(21, 0, 0);
    
        flex-basis: 150px;
        flex-shrink:3;
        flex-grow: 1;
       

       
    }
    section.filho3{
        order: -3;
        background-color: brown;
        padding: 20px;
        color: white;
        
        flex-basis: 150px;
        flex-grow: 1;
        flex-shrink: 2;

       
    }
    section.filho4{
        order: -4;
        background-color: blueviolet;
        padding: 20px;
        color: white;
        font-size: 1.3em;
        font-weight: bolder;
        flex-basis: 150px;
        flex-shrink: 7;
        flex-grow: 1;
    }
</style>
<body>
    <main>
        <div id="container">
            <section class="filho">
                Exemplo Caixa A
              
              

            </section>
            <section class="filho2">
                Exemplo Caixa B
               

            </section>
            <section class="filho3">
                Exemplo Caixa C
                
            </section>
            <section class="filho4">
                Exemplo Caixa D
                

            </section>
        </div>
    </main>
    
</body>
</html>
